# The site's screenshots and videos, remade by themselves when the app's screens change (owner, 20 Oct 2026: "I want me doing nothing and everything
# being done automatically"; moved here from the public repo the same day: marketing stays private). desktop/scripts/media/media.mjs records the
# public app (demo mode, dark, the nurse persona) and the real extension on a fictional form, adds zooms and clicks in code (no AI here: the
# director's plans are committed), checks every piece, then opens a PR that refreshes the files site/web/public/media already holds. The owner merges it.
# Cost: the daily check is a 1-minute Linux job; the recording runs on a Mac runner (the site shows the Mac app, with its fonts), only when the
# public files that draw the screens changed since the last refresh (.public-media), or by hand, or when this pipeline changes on main.
name: Release · Product media

on:
  schedule:
    - cron: '41 4 * * *'
  push:
    branches: [main]
    paths:
      - 'desktop/scripts/media/**'
      - '.github/workflows/product-media.yml'
  workflow_dispatch:
    inputs:
      pieces:
        description: 'Pieces (hero extension-fill stills snips); empty = all'
        required: false
        default: ''

permissions:
  contents: read

concurrency:   # newest wins; a by-hand run is its own group and never cancelled
  group: product-media-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      record: ${{ steps.change.outputs.record }}
      sha: ${{ steps.change.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: .private
      - name: Lay the public repo's tree under this one
        run: .private/tools/tree.sh
      - name: Did the public files that draw the screens change
        id: change
        working-directory: .private
        run: |
          state=$(tools/public-watch.sh "$GITHUB_WORKSPACE" media $(cat tools/media-paths.txt))
          record=no
          if [ "${{ github.event_name }}" != schedule ] || [ "$state" = changed ]; then record=yes; fi
          echo "record=$record" >> "$GITHUB_OUTPUT"; echo "sha=$PUBLIC_SHA" >> "$GITHUB_OUTPUT"
          echo "product-media: screens $state since the last refresh, event ${{ github.event_name }} -> record $record (public ${PUBLIC_SHA:0:9})"

  media:
    needs: watch
    if: needs.watch.outputs.record == 'yes'
    runs-on: macos-14
    timeout-minutes: 40
    permissions:
      contents: write        # the branch media-refresh
      pull-requests: write   # its PR
    steps:
      - uses: actions/checkout@v5
        with:
          path: .private
      - name: Lay the public repo's tree under this one (the commit the check saw)
        run: .private/tools/tree.sh --ref '${{ needs.watch.outputs.sha }}'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: ffmpeg with WebP
        run: |   # the runner's ffmpeg and Homebrew's plain ffmpeg have no libwebp encoder (public runs 39451422713, 39454764473): ffmpeg-full has it
          if ! ffmpeg -hide_banner -encoders 2>/dev/null | grep -qE ' libwebp '; then
            brew install ffmpeg-full
            bin="$(brew --prefix ffmpeg-full)/bin"
            echo "$bin" >> "$GITHUB_PATH"
            export PATH="$bin:$PATH"
          fi
          for encoder in libx264 libvpx-vp9 libwebp; do ffmpeg -hide_banner -encoders | grep -qE " $encoder " || { echo "ffmpeg lacks $encoder"; exit 1; }; done
      - name: Install the app
        working-directory: desktop
        run: npm ci
      - name: Install the browser harness (the real extension runs in its Chromium)
        working-directory: desktop/e2e
        run: |
          npm ci || npm install
          npx playwright-core install chromium
      - name: Record, render, check
        working-directory: desktop
        env:
          PIECES: ${{ inputs.pieces }}
        run: node scripts/media/media.mjs --out "$RUNNER_TEMP/media" $PIECES 2>&1 | tee "$RUNNER_TEMP/media.log"; exit "${PIPESTATUS[0]}"
      - uses: actions/upload-artifact@v6
        with:
          name: product-media
          path: ${{ runner.temp }}/media
          retention-days: 30
      - name: Open the refresh PR (only the files the site already shows)
        working-directory: .private
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/media-refresh.sh "$RUNNER_TEMP/media" "$GITHUB_WORKSPACE" '${{ needs.watch.outputs.sha }}' | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
